<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e7d32" />
    <meta name="description" content="Alcancía Viva - Educación financiera personal con un ecosistema vivo e interfaces no convencionales" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=piggy-v1" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Aplica el tema guardado antes del primer pintado (evita el destello claro en modo oscuro).
      try { var t = localStorage.getItem('av-theme') || 'system'; document.documentElement.dataset.theme = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}
    </script>
    <title>Alcancía Viva - Educación Financiera</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
