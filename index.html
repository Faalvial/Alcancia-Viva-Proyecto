    <script>
      // Aplica el tema guardado antes del primer pintado (evita el destello claro en modo oscuro).
      try { var t = localStorage.getItem('av-theme') || 'system'; var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = d ? 'dark' : 'light'; if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d1a13'); } catch (e) {}
    </script>
    <title>Alcancía Viva - Educación Financiera</title>
