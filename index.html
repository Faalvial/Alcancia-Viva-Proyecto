<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f3" />
    <meta name="description" content="Alcancía Viva - Educación financiera personal con un ecosistema vivo e interfaces no convencionales" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=piggy-v1" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Aplica el tema guardado antes del primer pintado (evita el destello claro en modo oscuro).
      try { var t = localStorage.getItem('av-theme') || 'system'; var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = d ? 'dark' : 'light'; if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d1a13'); } catch (e) {}
    </script>
    <script>
      // Sin sesión se verá el acceso: adelanta su imagen principal (LCP). Con sesión no se descarga.
      try { var signed = Object.keys(localStorage).some(function (k) { return /^sb-.*-auth-token$/.test(k); }); if (!signed) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '/garden/floreciente-720.webp'; l.setAttribute('imagesrcset', '/garden/floreciente-720.webp 720w, /garden/floreciente.webp 1280w'); l.setAttribute('imagesizes', '(max-width: 767px) 92vw, 46vw'); l.setAttribute('fetchpriority', 'high'); document.head.appendChild(l); } } catch (e) {}
    </script>
    <title>Alcancía Viva - Educación Financiera</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
